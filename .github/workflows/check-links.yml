name: Check links

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "0 4 1 * *" # monthly, to catch links that break over time
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress "./**/*.md"
          fail: true
        env:
          # Authenticated requests avoid GitHub rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
